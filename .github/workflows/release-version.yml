name: Release (SemVer + Tag)

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: versioning
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "feat"
          version_format: "${MAJOR}.${MINOR}.${PATCH}"

      - name: Create Git tag if new version
        if: ${{ steps.versioning.outputs.version_changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_VERSION="${{ steps.versioning.outputs.version }}"
          TAG="v${NEW_VERSION}"

          # Update pubspec.yaml version (keep build number as 0 for now)
          # Format: version: X.Y.Z+0
          sed -i -E "s/^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$/version: ${NEW_VERSION}+0/" pubspec.yaml

          git add pubspec.yaml
          git commit -m "chore: bump version to ${NEW_VERSION}" || echo "No changes to commit"
          git tag "$TAG"
          git push origin "$TAG"